pre-commit:
  commands:
    check:
      run: mise run check
      fail_text: "Rust formatting or Clippy checks failed."
    machete:
      run: mise run machete
      fail_text: "Unused-crate detection (cargo-machete) failed."

pre-push:
  commands:
    test:
      run: mise run test
      fail_text: "Rust tests failed."
    deny:
      run: mise run deny
      fail_text: "Dependency policy check (cargo-deny) failed."
