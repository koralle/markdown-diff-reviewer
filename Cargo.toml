[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.dependencies]
# gpui-kit builds on Longbridge's published GPUI fork (`gpui-pre`),
# re-exported as `gpui` — not the crates.io `gpui` crate.
gpui = { package = "gpui-pre", version = "0.3.5" }
gpui-kit = "0.6.4"
